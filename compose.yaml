services:
  app:
    build: .
    ports:
      - "5001:5001"
    environment:
      DATABASE_URL: postgresql://visituser:visitpassword@db:5432/visitcounter
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U visituser -d visitcounter
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
